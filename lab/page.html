<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard Test Lab</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2127; --muted: #5f6670; --line: #dde0e5;
    --accent: #2f6fde; --ok: #1f8a4c; --bad: #c63b3b; --warn-bg: #fff4d6; --warn: #7a5600; --log: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --card: #1a1e24; --text: #e6e8eb; --muted: #9aa2ad; --line: #2b313a;
      --accent: #6aa0ff; --ok: #4cc27f; --bad: #ff7676; --warn-bg: #3a2e10; --warn: #ffd27a; --log: #0d1014;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  .goal { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .goal small { color: var(--muted); display: block; margin-top: 4px; }
  .banner { border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; background: var(--warn-bg); color: var(--warn); display: none; white-space: pre-wrap; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 16px; }
  @media (max-width: 760px) { .card { grid-template-columns: minmax(0, 1fr); } }
  .card h2 { font-size: 17px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .chip.ok { color: var(--ok); border-color: var(--ok); }
  .chip.bad { color: var(--bad); border-color: var(--bad); }
  .chip.run { color: var(--accent); border-color: var(--accent); }
  .desc { color: var(--muted); margin: 4px 0 8px; }
  .success { margin: 0 0 10px; }
  .success b { color: var(--ok); }
  .sheet { width: 100%; border-radius: 6px; border: 1px solid var(--line); background: #eceff2; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.ok { color: var(--ok); border-color: var(--ok); }
  button.bad { color: var(--bad); border-color: var(--bad); }
  textarea { width: 100%; min-height: 56px; font: inherit; padding: 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--text); margin: 8px 0; }
  pre.log { background: var(--log); border: 1px solid var(--line); border-radius: 7px; padding: 8px; font-size: 12px; max-height: 220px; overflow: auto; white-space: pre-wrap; margin: 10px 0 0; }
  .history { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .history div { margin: 2px 0; }
  details.archived { margin-top: 24px; }
  details.archived summary { cursor: pointer; color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); }
  .sync { display: none; margin: 10px 0 4px; background: #000; color: #fff; border-radius: 6px; text-align: center; font: 700 72px/1.1 ui-monospace, monospace; padding: 14px 0; max-width: 480px; }
  .sync small { display: block; font: 13px system-ui, sans-serif; color: #aaa; }
  .sync.show { display: block; }
  .react { display: none; margin: 10px 0 4px; max-width: 480px; }
  .react.show { display: block; }
  .flashbox { display: none; }
  .react.hasflash .flashbox { display: block; }
  .react .flashbox { background: #000; color: #000; border-radius: 6px; text-align: center; font: 800 64px/1 ui-monospace, monospace; padding: 26px 0; margin-bottom: 8px; }
  .flashbox.on { color: #fff; }
  .seen { width: 100%; padding: 26px; font-size: 26px; font-weight: 800; background: var(--accent); color: #fff; border-color: var(--accent); }
  .seen:active { transform: scale(.98); }
  .pad { display: none; margin: 10px 0 4px; }
  .pad.show { display: block; }
  .pad canvas { display: block; width: 100%; max-width: 480px; aspect-ratio: 240 / 136; background: #000; image-rendering: pixelated; touch-action: none; border-radius: 6px; cursor: crosshair; border: 1px solid var(--line); }
  .pad .row { margin-top: 8px; }
  .pad button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Keyboard test lab</h1>
  <div class="goal" id="goal">Loading…</div>
  <div class="banner" id="banner"></div>
  <div id="active"></div>
  <details class="archived" id="archivedBox"><summary>Archived tests</summary><div id="archived"></div></details>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let state = null, builtFor = "";

function chipFor(id) {
  const run = state.runs[id], res = (state.results[id] || []).at(-1);
  if (run?.running) return '<span class="chip run">running…</span>';
  if (res) return res.outcome === "success" ? '<span class="chip ok">✓ success</span>' : '<span class="chip bad">✗ failure</span>';
  if (run && run.exitCode !== null) return `<span class="chip">ran (exit ${run.exitCode}) — report below</span>`;
  return '<span class="chip">not run yet</span>';
}

function card(c) {
  return `<section class="card" data-id="${c.id}">
    <div>
      <h2>${esc(c.title)} <span class="chipwrap"></span></h2>
      <div class="desc">${esc(c.description)}</div>
      <div class="success"><b>Success looks like:</b> ${esc(c.success)}</div>
      ${c.archived ? `<div class="note">Archived: ${esc(c.archived)}</div>` : `
      <div class="row">
        <button class="primary runbtn">Run on keyboard</button>
        <span class="note">${c.readOnly ? "Read-only: the screen won't change." : "Watch the screen (GIF page: Fn + Right Shift)."}</span>
      </div>
      ${c.interactive ? `<div class="pad">
        <canvas width="240" height="136"></canvas>
        <div class="row"><span class="note">Delay:</span>
          <button data-lead="8" class="on">1 s</button><button data-lead="4">0.5 s</button><button data-lead="2">0.25 s</button>
          <button data-clear>Clear</button></div>
        <div class="note">${esc(c.interactive)}</div>
      </div>` : ""}
      ${c.react ? `<div class="react">
        <div class="flashbox">GO</div>
        <button class="seen">SEEN</button>
        <div class="note">${esc(c.react)}</div>
      </div>` : ""}
      <div class="sync"><span class="syncnum">0</span><small>this counter vs. the keyboard screen: how many behind?</small></div>
      <textarea class="notebox" placeholder="What did you see? (optional for success, helpful for failures)"></textarea>
      <div class="row">
        <button class="ok reportbtn" data-outcome="success">✓ Success</button>
        <button class="bad reportbtn" data-outcome="failure">✗ Failure</button>
        <span class="note reportnote"></span>
      </div>`}
      <pre class="log" style="display:none"></pre>
      <div class="history"></div>
    </div>
    <div><img class="sheet" alt="Expected screens for ${esc(c.title)}" src="/pictures/${c.id}.png?v=${state.casesVersion}"></div>
  </section>`;
}

function build() {
  const active = state.cases.filter((c) => !c.archived), archived = state.cases.filter((c) => c.archived);
  $("#active").innerHTML = active.map(card).join("") || '<p class="note">No active tests.</p>';
  $("#archived").innerHTML = archived.map(card).join("");
  $("#archivedBox").style.display = archived.length ? "" : "none";
  for (const el of document.querySelectorAll(".card")) {
    const id = el.dataset.id;
    el.querySelector(".runbtn")?.addEventListener("click", async () => {
      const r = await fetch("/api/run", { method: "POST", body: JSON.stringify({ id }) }).then((r) => r.json());
      if (r.error) alert(r.error);
      poll();
    });
    const pad = el.querySelector(".pad");
    if (pad) setupPad(pad);
    el.querySelector(".seen")?.addEventListener("pointerdown", () => {
      // Use the click's own time; the test compares it with when the GO went out.
      outbox.push(`seen ${Date.now()}`);
    });
    for (const b of el.querySelectorAll(".reportbtn")) b.addEventListener("click", async () => {
      const note = el.querySelector(".notebox").value;
      if (b.dataset.outcome === "failure" && !note.trim()) { el.querySelector(".reportnote").textContent = "Please say what you saw."; return; }
      await fetch("/api/report", { method: "POST", body: JSON.stringify({ id, outcome: b.dataset.outcome, note }) });
      el.querySelector(".notebox").value = "";
      el.querySelector(".reportnote").textContent = "Recorded — Claude will pick it up.";
      poll();
    });
  }
}

function update() {
  $("#goal").innerHTML = `<b>Goal progress:</b> ${esc(state.status.goal || "—")}<small>Updated ${esc(state.status.updated || "")}</small>`;
  const msgs = [];
  if (state.casesError) msgs.push("Test list failed to load:\n" + state.casesError);
  if (state.holders.length) msgs.push("⚠ Something else is using the keyboard: " + state.holders.join(", ") + ". Close Hub / web-tool tabs before running tests.");
  $("#banner").style.display = msgs.length ? "block" : "none";
  $("#banner").textContent = msgs.join("\n\n");
  for (const el of document.querySelectorAll(".card")) {
    const id = el.dataset.id, run = state.runs[id];
    el.querySelector(".chipwrap").innerHTML = chipFor(id);
    const btn = el.querySelector(".runbtn");
    if (btn) btn.disabled = !!state.running || state.holders.length > 0;
    // A running test that prints "SYNC <epochMs> <periodMs>" gets a live counter on its card.
    const syncEl = el.querySelector(".sync");
    const syncLine = state.running === id && run ? [...run.lines].reverse().find((l) => / SYNC \d+ \d+$/.test(l)) : null;
    if (syncEl && syncLine) {
      const [, t0, period] = syncLine.match(/ SYNC (\d+) (\d+)$/);
      syncEl.dataset.t0 = t0;
      syncEl.dataset.period = period;
      syncEl.classList.add("show");
    } else if (syncEl) {
      syncEl.classList.remove("show");
    }
    const react = el.querySelector(".react");
    if (react) {
      const on = state.running === id;
      react.classList.toggle("show", on);
      // Schedule page flashes the test asked for ("FLASHAT <epochMs>"), once each.
      for (const line of on && run ? run.lines : []) {
        const m = line.match(/ FLASHAT (\d+)$/);
        if (!m || scheduledFlashes.has(m[1])) continue;
        scheduledFlashes.add(m[1]);
        react.classList.add("hasflash");
        const box = react.querySelector(".flashbox");
        setTimeout(() => { box.classList.add("on"); setTimeout(() => box.classList.remove("on"), 800); }, Math.max(0, Number(m[1]) - Date.now()));
      }
    }
    const pad = el.querySelector(".pad");
    if (pad) {
      const on = state.running === id;
      if (on && !pad.classList.contains("show")) pad.resetPad();
      pad.classList.toggle("show", on);
    }
    const log = el.querySelector(".log");
    if (run) {
      const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
      log.style.display = "block";
      log.textContent = run.lines.join("\n") + (run.running ? "\n…" : `\n[exit ${run.exitCode}]`);
      if (atBottom) log.scrollTop = log.scrollHeight;
    }
    const hist = (state.results[id] || []).slice(-5).reverse();
    el.querySelector(".history").innerHTML = hist.map((h) =>
      `<div>${h.outcome === "success" ? "✓" : "✗"} ${new Date(h.ts).toLocaleString()} ${h.note ? "— " + esc(h.note) : ""}</div>`).join("");
  }
}

async function poll() {
  try {
    state = await fetch("/api/state").then((r) => r.json());
  } catch (e) {
    $("#banner").style.display = "block";
    $("#banner").textContent = "Dashboard server not reachable: " + e.message;
    return;
  }
  try {
    const sig = state.casesVersion + ":" + state.cases.map((c) => c.id + (c.archived ? "!" : "")).join(",");
    if (sig !== builtFor) { build(); builtFor = sig; }
    update();
  } catch (e) {
    $("#banner").style.display = "block";
    $("#banner").textContent = "Dashboard page error (tell Claude): " + e.message;
    console.error(e);
  }
}
// Drawing pad: draws locally at once and sends the points to the running test in small batches.
let outbox = [];
const scheduledFlashes = new Set();
setInterval(async () => {
  if (!outbox.length) return;
  const lines = outbox; outbox = [];
  await fetch("/api/input", { method: "POST", body: JSON.stringify({ lines }) }).catch(() => {});
}, 40);
function setupPad(pad) {
  const cv = pad.querySelector("canvas"), g = cv.getContext("2d");
  let last = null;
  const dot = (x, y) => { g.fillStyle = "#fff"; g.fillRect(x - 2, y - 2, 5, 5); outbox.push(`dot ${x} ${y}`); };
  const at = (e) => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 239), Math.round((e.clientY - r.top) / r.height * 135)]; };
  const line = (a, b) => {
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 3));
    for (let i = 1; i <= n; i++) dot(Math.round(a[0] + (b[0] - a[0]) * i / n), Math.round(a[1] + (b[1] - a[1]) * i / n));
  };
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); last = at(e); dot(...last); });
  cv.addEventListener("pointermove", (e) => { if (!last) return; const p = at(e); line(last, p); last = p; });
  const up = () => { last = null; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  pad.resetPad = () => { g.fillStyle = "#000"; g.fillRect(0, 0, 240, 136); for (const b of pad.querySelectorAll("[data-lead]")) b.classList.toggle("on", b.dataset.lead === "8"); };
  pad.querySelector("[data-clear]").addEventListener("click", () => { g.fillStyle = "#000"; g.fillRect(0, 0, 240, 136); outbox.push("clear"); });
  for (const b of pad.querySelectorAll("[data-lead]")) b.addEventListener("click", () => {
    for (const o of pad.querySelectorAll("[data-lead]")) o.classList.toggle("on", o === b);
    outbox.push(`lead ${b.dataset.lead}`);
  });
  pad.resetPad();
}
function tickSync() {
  for (const el of document.querySelectorAll(".sync.show")) {
    const n = Math.floor((Date.now() - Number(el.dataset.t0)) / Number(el.dataset.period));
    el.querySelector(".syncnum").textContent = String(Math.max(0, n));
  }
  requestAnimationFrame(tickSync);
}
requestAnimationFrame(tickSync);
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
